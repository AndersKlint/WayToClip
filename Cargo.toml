[package]
name = "waytoclip"
version = "0.1.0"
edition = "2024"

[dependencies]
gio = { version = "0.22", features = ["v2_80"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
xkbcommon = "0.9"
futures-channel = "0.3"
libc = "0.2"
serde_json = "1"
regress = "0.12"
sha2 = "0.10"
